<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laboratório de autenticação</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="card">
      <h1>Laboratório de autenticação</h1>
      <p id="status">A sessão ainda não foi consultada.</p>

      <div class="actions" aria-label="Opções de autenticação">
        <a class="button" href="/oauth/login/google">Entrar com Google</a>
        <a class="button" href="/oauth/login/github">Entrar com GitHub</a>
      </div>

      <form method="post" action="/oauth/logout">
        <button type="submit">Sair</button>
      </form>
    </main>
  </body>
</html>
