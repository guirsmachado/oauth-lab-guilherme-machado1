name: migrar

on:
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - '.github/workflows/migrar.yml'

permissions:
  contents: read

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Aplica migrações no D1 remoto
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
        shell: bash
        run: |
          if [ -z "$D1_DATABASE_NAME" ]; then
            echo "::error::Configure a variável D1_DATABASE_NAME em Settings > Secrets and variables > Actions"
            exit 1
          fi
          npx --yes wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote

      - name: Resume as migrações com IA (bônus)
        id: resumo
        uses: actions/ai-inference@v1
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt: "Resuma em português, em até 5 tópicos, as migrações SQL versionadas neste repositório e os cuidados para aplicá-las no Cloudflare D1. Não afirme que foram aplicadas sem evidência do log anterior."
          system-prompt: "Você resume migrações de banco de dados com precisão."

      - name: Publica resumo
        env:
          RESUMO_IA: ${{ steps.resumo.outputs.response }}
        run: |
          {
            echo "## Resumo das migrações D1"
            echo
            cat "$RESPONSE_FILE"
          } >> "$GITHUB_STEP_SUMMARY"
